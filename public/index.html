<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0f0f1a;
            min-height: 100vh;
            color: #e0e0e0;
        }

        /* LOGIN */
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
        }
        .login-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
        }
        .login-logo {
            width: 56px; height: 56px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; margin: 0 auto 24px;
        }
        .login-title { text-align: center; font-size: 22px; font-weight: 600; color: #fff; margin-bottom: 6px; }
        .login-sub { text-align: center; font-size: 13px; color: #888; margin-bottom: 32px; }
        .input-group { margin-bottom: 20px; }
        .input-label { display: block; font-size: 12px; font-weight: 500; color: #999; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .input-field {
            width: 100%; padding: 12px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; color: #fff; font-size: 14px;
            font-family: inherit; transition: all 0.3s;
        }
        .input-field:focus { outline: none; border-color: #6366f1; background: rgba(99,102,241,0.08); }
        .btn-login {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none; border-radius: 10px;
            color: white; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: all 0.3s;
            font-family: inherit;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(99,102,241,0.3); }
        .login-creds { text-align: center; font-size: 11px; color: #555; margin-top: 24px; line-height: 1.8; }

        /* APP LAYOUT */
        .app { display: none; }
        .topbar {
            background: rgba(15,15,26,0.95);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 0 32px;
            height: 64px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(20px);
        }
        .topbar-brand { display: flex; align-items: center; gap: 12px; }
        .topbar-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }
        .topbar-name { font-size: 16px; font-weight: 600; color: #fff; }
        .topbar-right { display: flex; align-items: center; gap: 16px; }
        .user-pill {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255,255,255,0.05);
            padding: 6px 14px 6px 8px;
            border-radius: 99px;
        }
        .user-avatar {
            width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 600;
        }
        .avatar-admin { background: linear-gradient(135deg, #f59e0b, #f97316); color: #fff; }
        .avatar-user { background: linear-gradient(135deg, #3b82f6, #6366f1); color: #fff; }
        .user-email { font-size: 12px; color: #ccc; }
        .role-tag {
            font-size: 10px; font-weight: 600; padding: 2px 8px;
            border-radius: 99px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .role-admin { background: rgba(245,158,11,0.15); color: #f59e0b; }
        .role-user { background: rgba(99,102,241,0.15); color: #818cf8; }
        .btn-logout {
            background: rgba(239,68,68,0.1); color: #ef4444;
            border: 1px solid rgba(239,68,68,0.2);
            padding: 6px 14px; border-radius: 8px;
            font-size: 12px; font-weight: 500; cursor: pointer;
            font-family: inherit; transition: all 0.2s;
        }
        .btn-logout:hover { background: rgba(239,68,68,0.2); }

        /* NAV MENU */
        .nav-menu {
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 0 32px;
            display: flex; gap: 4px;
        }
        .nav-item {
            padding: 12px 20px;
            font-size: 13px; font-weight: 500;
            color: #777; cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .nav-item:hover { color: #bbb; }
        .nav-item.active { color: #818cf8; border-bottom-color: #6366f1; }
        .nav-item.admin-tag { color: #f59e0b; }
        .nav-item.admin-tag:hover { color: #fbbf24; }

        /* MAIN */
        .main { padding: 28px 32px; max-width: 1200px; margin: 0 auto; }

        /* STAT CARDS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
        }
        .stat-total::before { background: linear-gradient(90deg, #6366f1, #8b5cf6); }
        .stat-pending::before { background: linear-gradient(90deg, #f59e0b, #f97316); }
        .stat-progress::before { background: linear-gradient(90deg, #3b82f6, #06b6d4); }
        .stat-done::before { background: linear-gradient(90deg, #10b981, #34d399); }
        .stat-label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .stat-value { font-size: 32px; font-weight: 700; }
        .stat-total .stat-value { color: #a5b4fc; }
        .stat-pending .stat-value { color: #fbbf24; }
        .stat-progress .stat-value { color: #60a5fa; }
        .stat-done .stat-value { color: #34d399; }

        /* ALERT */
        .alert {
            padding: 12px 16px; border-radius: 10px; margin-bottom: 16px;
            font-size: 13px; font-weight: 500;
        }
        .alert-success { background: rgba(16,185,129,0.1); color: #34d399; border: 1px solid rgba(16,185,129,0.2); }
        .alert-error { background: rgba(239,68,68,0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }

        /* SECTION */
        .section { margin-bottom: 32px; }
        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .section-title { font-size: 18px; font-weight: 600; color: #fff; }

        /* CREATE FORM */
        .create-form {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            padding: 24px;
        }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-full { grid-column: 1 / -1; }
        .btn-create {
            padding: 11px 28px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none; border-radius: 10px;
            color: white; font-size: 13px; font-weight: 600;
            cursor: pointer; font-family: inherit; transition: all 0.3s;
        }
        .btn-create:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99,102,241,0.3); }

        /* TASK TABLE */
        .task-table {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            overflow: hidden;
        }
        .task-table thead th {
            padding: 14px 16px;
            font-size: 11px; font-weight: 600;
            color: #888; text-transform: uppercase; letter-spacing: 0.5px;
            text-align: left;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .task-table tbody tr {
            transition: background 0.2s;
        }
        .task-table tbody tr:hover { background: rgba(255,255,255,0.03); }
        .task-table td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 13px;
        }
        .task-table tbody tr:last-child td { border-bottom: none; }
        .task-id {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 11px;
            color: #6366f1;
            background: rgba(99,102,241,0.1);
            padding: 4px 8px;
            border-radius: 6px;
            letter-spacing: 0.3px;
        }
        .task-title-cell { font-weight: 500; color: #fff; }
        .task-desc-cell { color: #888; font-size: 12px; max-width: 200px; }
        .status-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 12px; border-radius: 99px;
            font-size: 11px; font-weight: 600;
        }
        .status-pending { background: rgba(245,158,11,0.12); color: #fbbf24; }
        .status-in_progress { background: rgba(59,130,246,0.12); color: #60a5fa; }
        .status-completed { background: rgba(16,185,129,0.12); color: #34d399; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; }
        .status-pending .status-dot { background: #fbbf24; }
        .status-in_progress .status-dot { background: #60a5fa; }
        .status-completed .status-dot { background: #34d399; }
        .task-date { font-size: 12px; color: #666; }
        .action-btn {
            width: 32px; height: 32px; border-radius: 8px; border: none;
            cursor: pointer; font-size: 14px; transition: all 0.2s;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .btn-edit { background: rgba(59,130,246,0.1); color: #60a5fa; }
        .btn-edit:hover { background: rgba(59,130,246,0.2); }
        .btn-delete { background: rgba(239,68,68,0.1); color: #f87171; }
        .btn-delete:hover { background: rgba(239,68,68,0.2); }
        .btn-disabled { opacity: 0.3; cursor: not-allowed; }
        .empty { text-align: center; padding: 60px; color: #555; font-size: 14px; }
        .actions-cell { display: flex; gap: 6px; }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .form-grid { grid-template-columns: 1fr; }
            .topbar, .nav-menu, .main { padding-left: 16px; padding-right: 16px; }
            .task-table { font-size: 12px; }
        }
    </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="login-page">
    <div class="login-card">
        <div class="login-logo">📋</div>
        <div class="login-title">Task Manager</div>
        <div class="login-sub">Automatización de Infraestructura Digital I</div>
        <div id="loginAlert"></div>
        <div class="input-group">
            <label class="input-label">Email</label>
            <input class="input-field" type="email" id="email" value="admin@example.com">
        </div>
        <div class="input-group">
            <label class="input-label">Contraseña</label>
            <input class="input-field" type="password" id="password" value="admin123">
        </div>
        <button class="btn-login" onclick="login()">Iniciar sesión</button>
    </div>
</div>

<!-- APP -->
<div id="appView" class="app">
    <div class="topbar">
        <div class="topbar-brand">
            <div class="topbar-icon">📋</div>
            <span class="topbar-name">Task Manager</span>
        </div>
        <div class="topbar-right">
            <div class="user-pill">
                <div class="user-avatar" id="userAvatar">AD</div>
                <span class="user-email" id="userEmail"></span>
                <span class="role-tag" id="roleTag"></span>
            </div>
            <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
        </div>
    </div>

    <div class="nav-menu" id="navMenu"></div>

    <div class="main">
        <div id="appAlert"></div>

        <!-- STATS -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card stat-total"><div class="stat-label">Total</div><div class="stat-value" id="statTotal">0</div></div>
            <div class="stat-card stat-pending"><div class="stat-label">Pendientes</div><div class="stat-value" id="statPending">0</div></div>
            <div class="stat-card stat-progress"><div class="stat-label">En progreso</div><div class="stat-value" id="statProgress">0</div></div>
            <div class="stat-card stat-done"><div class="stat-label">Completadas</div><div class="stat-value" id="statDone">0</div></div>
        </div>

        <!-- CREATE -->
        <div class="section" id="createSection">
            <div class="section-header"><div class="section-title">Crear nueva tarea</div></div>
            <div class="create-form">
                <div class="form-grid">
                    <div class="form-full">
                        <label class="input-label">Título</label>
                        <input class="input-field" type="text" id="titleInput" placeholder="Ej: Configurar servidor de red">
                    </div>
                    <div class="form-full">
                        <label class="input-label">Descripción</label>
                        <textarea class="input-field" id="descInput" rows="3" placeholder="Ej: Configurar el servidor DHCP para la red local" style="resize: vertical;"></textarea>
                    </div>
                    <div>
                        <label class="input-label">Estado</label>
                        <select class="input-field" id="statusInput">
                            <option value="pending">Pendiente</option>
                            <option value="in_progress">En progreso</option>
                            <option value="completed">Completada</option>
                        </select>
                    </div>
                    <div style="display: flex; align-items: flex-end;">
                        <button class="btn-create" onclick="createTask()" style="width: 100%;">+ Crear tarea</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- LIST -->
        <div class="section" id="listSection">
            <div class="section-header">
                <div class="section-title">Gestión de tareas</div>
                <button class="btn-create" onclick="loadTasks()" style="padding: 8px 16px; font-size: 12px;">↻ Actualizar</button>
            </div>
            <div id="tasksContainer" class="empty">Cargando...</div>
        </div>
    </div>
</div>

<script>
    const API = 'http://localhost:3000/api';
    let token = null;
    let user = null;

    function generateTaskId(id) {
        const hex = id.toString(16).padStart(4, '0');
        const prefix = 'TSK';
        const hash = ((id * 2654435761) >>> 0).toString(16).substring(0, 4);
        return `${prefix}-${hex.toUpperCase()}-${hash.toUpperCase()}`;
    }

    function statusLabel(s) {
        const map = { pending: 'Pendiente', in_progress: 'En progreso', completed: 'Completada' };
        return map[s] || s;
    }

    function formatDate(d) {
        return new Date(d).toLocaleDateString('es-MX', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    function showAlert(id, msg, type) {
        document.getElementById(id).innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
        setTimeout(() => { document.getElementById(id).innerHTML = ''; }, 4000);
    }

    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        if (!email || !password) return showAlert('loginAlert', 'Email y contraseña requeridos', 'error');

        try {
            const r = await fetch(API + '/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            if (!r.ok) throw new Error('Credenciales inválidas');
            const data = await r.json();
            token = data.access_token;
            user = data.user;

            document.getElementById('loginView').style.display = 'none';
            document.getElementById('appView').style.display = 'block';
            document.getElementById('userEmail').textContent = user.email;

            const initials = user.email.substring(0, 2).toUpperCase();
            const avatarEl = document.getElementById('userAvatar');
            avatarEl.textContent = initials;
            avatarEl.className = `user-avatar avatar-${user.role.toLowerCase()}`;

            const tagEl = document.getElementById('roleTag');
            tagEl.textContent = user.role;
            tagEl.className = `role-tag role-${user.role.toLowerCase()}`;

            buildMenu();
            loadTasks();
        } catch (e) {
            showAlert('loginAlert', e.message, 'error');
        }
    }

    function buildMenu() {
        let html = `
            <div class="nav-item active" onclick="switchTab(this,'all')">📊 Dashboard</div>
            <div class="nav-item" onclick="switchTab(this,'create')">➕ Nueva tarea</div>
            <div class="nav-item" onclick="switchTab(this,'list')">📋 Ver tareas</div>
        `;
        if (user.role === 'ADMIN') {
            html += `<div class="nav-item admin-tag" onclick="switchTab(this,'list')">⚙️ Administrar</div>`;
        }
        document.getElementById('navMenu').innerHTML = html;
    }

    function switchTab(el, tab) {
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('statsGrid').style.display = (tab === 'all' || tab === 'list') ? 'grid' : 'none';
        document.getElementById('createSection').style.display = (tab === 'all' || tab === 'create') ? 'block' : 'none';
        document.getElementById('listSection').style.display = (tab === 'all' || tab === 'list') ? 'block' : 'none';
    }

    function logout() {
        token = null; user = null;
        document.getElementById('loginView').style.display = '';
        document.getElementById('appView').style.display = 'none';
    }

    function updateStats(tasks) {
        document.getElementById('statTotal').textContent = tasks.length;
        document.getElementById('statPending').textContent = tasks.filter(t => t.status === 'pending').length;
        document.getElementById('statProgress').textContent = tasks.filter(t => t.status === 'in_progress').length;
        document.getElementById('statDone').textContent = tasks.filter(t => t.status === 'completed').length;
    }

    async function loadTasks() {
        const container = document.getElementById('tasksContainer');
        try {
            const r = await fetch(API + '/tasks', { headers: { 'Authorization': `Bearer ${token}` } });
            if (!r.ok) throw new Error('No autorizado');
            const tasks = await r.json();
            updateStats(tasks);

            if (!tasks.length) {
                container.innerHTML = '<div class="empty">No hay tareas registradas. Crea la primera.</div>';
                return;
            }

            container.innerHTML = `<table class="task-table">
                <thead><tr>
                    <th>ID</th><th>Título</th><th>Descripción</th><th>Estado</th><th>Fecha</th><th>Acciones</th>
                </tr></thead>
                <tbody>${tasks.map(t => `<tr>
                    <td><span class="task-id">${generateTaskId(t.id)}</span></td>
                    <td class="task-title-cell">${t.title}</td>
                    <td class="task-desc-cell">${t.description || '—'}</td>
                    <td><span class="status-badge status-${t.status || 'pending'}"><span class="status-dot"></span>${statusLabel(t.status)}</span></td>
                    <td class="task-date">${formatDate(t.createdAt)}</td>
                    <td><div class="actions-cell">
                        <button class="action-btn btn-edit" onclick="editTask(${t.id}, '${t.title.replace(/'/g, "\\'")}', '${(t.description||'').replace(/'/g, "\\'")}', '${t.status}')" title="Editar">✏️</button>
                        ${user.role === 'ADMIN'
                            ? `<button class="action-btn btn-delete" onclick="deleteTask(${t.id})" title="Eliminar">🗑️</button>`
                            : `<button class="action-btn btn-delete btn-disabled" disabled title="Solo Admin">🔒</button>`
                        }
                    </div></td>
                </tr>`).join('')}</tbody>
            </table>`;
        } catch (e) {
            container.innerHTML = `<div class="empty" style="color:#f87171;">Error: ${e.message}</div>`;
        }
    }

    async function createTask() {
        const title = document.getElementById('titleInput').value.trim();
        if (!title) return showAlert('appAlert', 'Título requerido', 'error');
        try {
            const r = await fetch(API + '/tasks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({
                    title,
                    description: document.getElementById('descInput').value,
                    status: document.getElementById('statusInput').value
                })
            });
            if (!r.ok) throw new Error('Error al crear');
            showAlert('appAlert', '✅ Tarea creada exitosamente', 'success');
            document.getElementById('titleInput').value = '';
            document.getElementById('descInput').value = '';
            loadTasks();
        } catch (e) { showAlert('appAlert', e.message, 'error'); }
    }

    async function editTask(id, title, desc, status) {
        const newTitle = prompt('Título:', title);
        if (newTitle === null) return;
        const newDesc = prompt('Descripción:', desc);
        const newStatus = prompt('Estado (pending / in_progress / completed):', status);
        const body = {};
        if (newTitle) body.title = newTitle;
        if (newDesc !== null) body.description = newDesc;
        if (newStatus) body.status = newStatus;

        try {
            const r = await fetch(API + '/tasks/' + id, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(body)
            });
            if (!r.ok) throw new Error('Error al editar');
            showAlert('appAlert', '✅ Tarea actualizada', 'success');
            loadTasks();
        } catch (e) { showAlert('appAlert', e.message, 'error'); }
    }

    async function deleteTask(id) {
        if (!confirm('¿Eliminar esta tarea?')) return;
        try {
            const r = await fetch(API + '/tasks/' + id, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!r.ok) throw new Error(r.status === 403 ? 'Sin permisos' : 'Error al eliminar');
            showAlert('appAlert', '✅ Tarea eliminada', 'success');
            loadTasks();
        } catch (e) { showAlert('appAlert', e.message, 'error'); }
    }
</script>
</body>
</html>
